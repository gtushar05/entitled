name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest rank-bm25 model2vec numpy
      - run: pytest -q --ignore=tests/test_corpus.py   # raw corpus is local-only; clause+calculator+retrieval+agent+eval tests run here
      - name: golden oracle still matches the live agent
        run: python scripts/reconcile_golden.py         # gate: frozen expected values vs. current calculator/agent
